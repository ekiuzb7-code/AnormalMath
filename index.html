<!doctype html>
<html lang="uz" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#eef1f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="AnormalMath — o'zbekcha matematika mashqi.">
<title>AnormalMath</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<script>
  // returning to the app in the same session must not replay the intro
  try { if (sessionStorage.getItem("anormalmath.splash") === "1") document.documentElement.classList.add("no-splash"); } catch (e) {}
</script>
</head>
<body>

<div class="splash" id="splash">
  <video id="splashVideo" class="splash-video" src="assets/splash.mp4"
         poster="assets/splash-poster.jpg" muted playsinline preload="auto"></video>
  <div class="splash-veil" aria-hidden="true"></div>
  <div class="splash-ui">
    <div class="splash-brand">AnormalMath</div>
    <div class="splash-sub">Matematikani o'rgan</div>
  </div>
  <button class="splash-skip" id="splashSkip">O'tkazib yuborish</button>
</div>

<div class="aurora" aria-hidden="true">
  <span class="blob b1"></span>
  <span class="blob b2"></span>
  <span class="blob b3"></span>
</div>

<header class="topbar glass">
  <button class="icon-btn" id="backBtn" hidden aria-label="Orqaga">
    <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="brand">
    <span class="brand-dot"></span>
    <span id="topTitle">AnormalMath</span>
  </div>
  <button class="icon-btn" id="searchBtn" aria-label="Qidiruv">
    <svg viewBox="0 0 24 24" width="21" height="21"><circle cx="11" cy="11" r="6.4" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M16 16l4.2 4.2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
  </button>
  <button class="icon-btn" id="themeBtn" aria-label="Tema">
    <svg id="themeIcon" viewBox="0 0 24 24" width="21" height="21"></svg>
  </button>
</header>

<main id="view" class="view"></main>

<nav class="tabbar glass" id="tabbar">
  <span class="tab-pill" id="tabPill" aria-hidden="true"></span>
  <button class="tab is-active" data-tab="home">
    <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    <span>Asosiy</span>
  </button>
  <button class="tab" data-tab="stats">
    <svg viewBox="0 0 24 24" width="22" height="22"><path d="M5 20V10M12 20V4M19 20v-7" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
    <span>Hisobot</span>
  </button>
  <button class="tab" data-tab="settings">
    <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    <span>Sozlama</span>
  </button>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
